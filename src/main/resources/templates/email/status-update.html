<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
</head>
<body style="font-family: Arial, sans-serif; padding: 24px; color: #333;">

  <h2 style="color: #1a73e8;">Shipment Update</h2>

  <p>Hello <span th:text="${ownerName}"></span>,</p>

  <p>Your shipment <strong th:text="'#' + ${shipmentId}"></strong> has been updated.</p>

  <table style="border-collapse: collapse; width: 100%; margin-top: 16px;">
    <tr style="background: #f5f5f5;">
      <td style="padding: 10px; font-weight: bold;">Status</td>
      <td style="padding: 10px;" th:text="${status}"></td>
    </tr>
    <tr>
      <td style="padding: 10px; font-weight: bold;">Location</td>
      <td style="padding: 10px;" th:text="${location} ?: 'Not specified'"></td>
    </tr>
    <tr style="background: #f5f5f5;">
      <td style="padding: 10px; font-weight: bold;">Note</td>
      <td style="padding: 10px;" th:text="${note} ?: 'No note'"></td>
    </tr>
    <tr>
      <td style="padding: 10px; font-weight: bold;">Updated at</td>
      <td style="padding: 10px;" th:text="${updatedAt}"></td>
    </tr>
  </table>

  <p style="margin-top: 24px; color: #888; font-size: 12px;">
    This is an automated message from Shiptrack.
  </p>

</body>
</html>
